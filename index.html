<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151b">
  <title>에이브의 자유서버 — 접속 중</title>
  <style>
    :root { color-scheme: dark; --blue:#1598ed; --ink:#111923; --white:#f6f8fb; --muted:rgba(245,248,252,.66); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#10151b; font-family:Inter,"Noto Sans KR","Malgun Gothic",sans-serif; }
    button { font:inherit; }
    .experience { position:relative; width:100%; height:100%; isolation:isolate; overflow:hidden; background:#10151b; }
    .scene { position:absolute; inset:0; z-index:0; background-position:center; background-size:cover; opacity:0; transform:scale(1.045); transition:opacity 1.6s ease, transform 7s ease; }
    .scene.active { opacity:1; transform:scale(1); }
    .shade { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg,rgba(8,13,20,.32),rgba(8,13,20,.22) 35%,rgba(8,13,20,.68)),linear-gradient(90deg,rgba(8,13,20,.35),transparent 70%); }
    .grain { position:absolute; inset:0; z-index:4; pointer-events:none; opacity:.09; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E"); }
    .topbar { position:absolute; z-index:3; inset:28px 34px auto; display:flex; justify-content:space-between; align-items:center; z-index:2; color:var(--white); letter-spacing:.14em; font-size:10px; font-weight:700; text-transform:uppercase; }
    .brand-mini { display:flex; align-items:center; gap:10px; }
    .brand-dot { width:8px; height:8px; border-radius:2px; background:#39aaff; box-shadow:0 0 18px #1598ed; transform:rotate(12deg); }
    .top-right { color:rgba(255,255,255,.65); display:flex; align-items:center; gap:9px; }
    .live-dot { width:6px;height:6px;border-radius:50%;background:#77e2a8;box-shadow:0 0 12px #77e2a8; }
    .center-stage { position:absolute; left:50%; top:50%; width:min(92vw,480px); transform:translate(-50%,-50%); text-align:center; color:var(--white); z-index:3; animation:rise .9s .2s both; }
    .mark-wrap { width:108px; height:100px; margin:0 auto 18px; position:relative; }
    .logo-shadow { position:absolute; width:100px; height:14px; left:4px; bottom:7px; background:rgba(0,0,0,.35); filter:blur(5px); border-radius:50%; }
    .gmark { position:absolute; inset:0 7px 12px 7px; transform:skew(-7deg); border-radius:7px 7px 10px 10px; background:linear-gradient(145deg,#28aaff,#0781da); box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.28); display:grid; place-items:center; }
    .gmark span { display:flex; align-items:center; justify-content:center; width:100%; height:100%; color:white; font-family:Arial,Helvetica,sans-serif; font-weight:800; font-size:76px; letter-spacing:-.09em; line-height:1; transform:skew(7deg) translate(-3px,-20px); text-shadow:0 2px 1px rgba(0,0,0,.08); }
    .lambda { position:absolute; right:6px; bottom:-1px; z-index:1; width:20px; height:20px; background:#f4df63; border:1px solid rgba(27,38,45,.5); border-radius:3px; color:#26313a; font:700 12px/18px Arial,sans-serif; transform:rotate(16deg); box-shadow:0 2px 4px rgba(0,0,0,.25); }
    .eyebrow { font-size:10px; line-height:1.4; letter-spacing:.34em; color:rgba(255,255,255,.72); font-weight:700; text-transform:uppercase; }
    h1 { margin:8px 0 8px; font-weight:800; letter-spacing:.025em; font-size:clamp(27px,5vw,43px); line-height:1.05; text-shadow:0 3px 25px rgba(0,0,0,.4); }
    .subtitle { margin:0; font-size:13px; color:rgba(255,255,255,.73); letter-spacing:.05em; }
    .loader { width:min(250px,70vw); margin:27px auto 0; }
    .loading-track { height:5px; overflow:hidden; border-radius:8px; background:rgba(255,255,255,.26); box-shadow:0 1px 6px rgba(0,0,0,.14); }
    .loading-fill { height:100%; width:38%; border-radius:inherit; background:linear-gradient(90deg,#4cc5ff,#b8edff); box-shadow:0 0 13px rgba(71,192,255,.8); animation:loading 1.8s cubic-bezier(.45,.05,.55,.95) infinite; }
    .loader-caption { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:rgba(255,255,255,.7); font-size:9px; letter-spacing:.13em; text-transform:uppercase; }
    .pulse { display:inline-block; width:5px;height:5px;border-radius:50%;margin-right:7px;vertical-align:1px;background:#83daff;animation:pulse 1s infinite alternate; }
    .footer { position:absolute; z-index:3; left:34px; right:34px; bottom:25px; display:flex; justify-content:space-between; align-items:flex-end; color:var(--white); }
    .photo-note { max-width:380px; text-shadow:0 2px 14px rgba(0,0,0,.8); }
    .photo-note strong { display:block; font-size:12px; letter-spacing:.15em; text-transform:uppercase; }
    .photo-note span { display:block; color:rgba(255,255,255,.65); font-size:11px; margin-top:5px; }
    .scene-controls { display:flex; gap:7px; align-items:center; }
    .scene-count { font-size:10px; letter-spacing:.14em; color:rgba(255,255,255,.78); margin-right:8px; font-variant-numeric:tabular-nums; }
    .dot { cursor:pointer; border:0; padding:0; width:5px; height:5px; border-radius:6px; background:rgba(255,255,255,.45); transition:all .25s ease; }
    .dot.active { width:22px; background:#fff; }
to{width:94%} }
    @keyframes loading { 0%{transform:translateX(-120%)} 100%{transform:translateX(360%)} }
    @keyframes pulse { to{opacity:.35;transform:scale(.8)} }
    @keyframes rise { from{opacity:0;transform:translate(-50%,-46%)} to{opacity:1;transform:translate(-50%,-50%)} }
    @media(max-width:600px){ .topbar{inset:20px 18px auto;font-size:9px}.footer{left:18px;right:18px;bottom:18px}.center-stage{top:50%}.photo-note span{max-width:220px;line-height:1.5}.scene-count{margin-right:3px}.dot{width:4px;height:4px}.dot.active{width:15px}.top-right{font-size:8px} }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="experience" aria-label="Garry's Mod loading page">
    <div class="scene active" id="sceneA" aria-hidden="true"></div>
    <div class="scene" id="sceneB" aria-hidden="true"></div>
    <div class="shade"></div><div class="grain"></div>
    <header class="topbar">
      <div class="brand-mini"><i class="brand-dot"></i><span>에이브의 자유서버</span></div>
      <div class="top-right"><i class="live-dot"></i><span>SERVER CONNECTING</span></div>
    </header>
    <section class="center-stage" aria-live="polite">
      <div class="mark-wrap" aria-label="Garry's Mod logo">
        <div class="logo-shadow"></div><div class="gmark"><span>g</span></div><div class="lambda">λ</div>
      </div>
      <div class="eyebrow">Sandbox Server</div>
      <h1>에이브의 자유서버</h1>
      <p class="subtitle">샌드박스 서버 · 규칙을 준수하며 자유롭게 즐겨 주세요</p>
      <div class="loader" aria-label="Loading">
        <div class="loading-track"><div class="loading-fill"></div></div>
        <div class="loader-caption"><span><i class="pulse"></i><span id="status">서버 정보 불러오는 중</span></span><span>LOADING</span></div>
      </div>
    </section>
    <footer class="footer">
      <div class="photo-note"><strong id="sceneTitle">샌드박스 월드</strong><span id="sceneCaption">도구와 소품으로 자유롭게 만들고 실험해 보세요.</span></div>
      <nav class="scene-controls" id="dots" aria-label="배경 장면 선택"></nav>
    </footer>
  </main>
  <script>
    (function(){
      var scenes = [
        {file:"scene-01.jpg", title:"샌드박스 월드", caption:"도구와 소품으로 자유롭게 만들고 실험해 보세요."},
        {file:"scene-02.jpg", title:"차량 스폰", caption:"차량을 소환해 맵 곳곳을 달려 보세요."},
        {file:"scene-03.jpg", title:"자유로운 건축", caption:"친구들과 함께 공간을 꾸미고 장면을 만들어 보세요."},
        {file:"scene-04.jpg", title:"맵 탐험", caption:"맵을 자유롭게 돌아다니며 샌드박스를 즐겨 보세요."},
        {file:"scene-05.jpg", title:"소품 실험", caption:"다양한 소품과 도구로 원하는 걸 만들어 보세요."},
        {file:"scene-06.jpg", title:"툴 활용", caption:"도구를 사용해 소품을 배치하고 조립해 보세요."},
        {file:"scene-07.jpg", title:"함께 만드는 샌드박스", caption:"상상한 장면을 만들고 친구들과 함께 즐겨 보세요."}
      ];
      var a = document.getElementById("sceneA"), b = document.getElementById("sceneB");
      var title = document.getElementById("sceneTitle"), caption = document.getElementById("sceneCaption");
      var dots = document.getElementById("dots");
      var current = 0, showingA = true, interval;
      function setScene(index){
        current = (index + scenes.length) % scenes.length;
        var next = showingA ? b : a;
        var prev = showingA ? a : b;
        next.style.backgroundImage = "url('assets/" + scenes[current].file + "')";
        next.classList.add("active"); prev.classList.remove("active"); showingA = !showingA;
        title.textContent = scenes[current].title; caption.textContent = scenes[current].caption;
        var all = dots.querySelectorAll("button");
        for(var i=0;i<all.length;i++){ all[i].classList.toggle("active", i===current); all[i].setAttribute("aria-current", i===current ? "true" : "false"); }
      }
      scenes.forEach(function(scene, index){
        var dot = document.createElement("button"); dot.type="button"; dot.className="dot"; dot.setAttribute("aria-label", "배경 " + (index+1) + " 보기");
        dot.addEventListener("click", function(){ setScene(index); restart(); }); dots.appendChild(dot);
        var image = new Image(); image.src = "assets/" + scene.file;
      });
      function restart(){ clearInterval(interval); interval=setInterval(function(){setScene(current+1);},6500); }
      setScene(0); restart();

    })();
  </script>
</body>
</html>
